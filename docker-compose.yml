# Runs the whole EventTix stack on one machine:  docker compose up --build
# Copy .env.example to .env first and set your own values.
name: eventtix

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventtix
      POSTGRES_USER: eventtix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventtix -d eventtix"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_NUMBER: ${BUILD_NUMBER:-local}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: eventtix-backend:${IMAGE_TAG:-dev}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://eventtix:${POSTGRES_PASSWORD}@db:5432/eventtix
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: eventtix-frontend:${IMAGE_TAG:-dev}
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
