# SonarQube analysis settings for EventTix (read by the scanner from the repository root).

sonar.projectKey=eventtix
sonar.projectName=EventTix
sonar.sourceEncoding=UTF-8

# What is analysed: the backend API and the web front end.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.js

# Not analysed: dependencies, build output, and code that is generated by tools
# (shadcn/ui building blocks and the router's generated route tree).
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/components/ui/**,frontend/src/routeTree.gen.ts

# Coverage is measured for the backend, where the business rules and tests live.
# The front end has no unit tests yet, and server.js only starts the server.
# The lcov file is written by the Test stage, with paths rewritten to start at the repository root.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov-root.info
sonar.coverage.exclusions=frontend/**,backend/src/server.js,backend/tests/**

# Tests repeat similar setup code on purpose, so they are left out of the duplication check.
sonar.cpd.exclusions=backend/tests/**
